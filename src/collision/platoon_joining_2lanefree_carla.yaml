description: |-
  Copyright 2023 <Your Organization>
  Content: 3-vehicle platoon straight passing through 3 intersections on 2lanefree map

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 0
        num: 0
        positions: []
      lidar:
        visualize: false
  map_manager:
    visualize: false
    activate: false
  behavior:
    max_speed: 80 # km/h
    tailgate_speed: 90
    overtake_allowed: false
    collision_time_ahead: 1.5
    local_planner:
      trajectory_dt: 0.25

platoon_base:
  max_capacity: 3
  inter_gap: 0.8 # increased time gap for intersection safety
  open_gap: 2.0
  warm_up_speed: 50

carla_traffic_manager:
  global_distance: 5.0
  global_speed_perc: -200 # ~60km/h
  vehicle_list:
    - spawn_position: [-200, 8.3, 0.3, 0, 0, 0] # NPC vehicle before 1st intersection
    - spawn_position: [50, 4.8, 0.3, 0, 0, 0]   # NPC vehicle at 2nd intersection
    - spawn_position: [300, 8.3, 0.3, 0, 0, 0]  # NPC vehicle after 3rd intersection

scenario:
  platoon_list:
    - name: intersection_platoon
      destination: [800, 8.3, 0.3] # After 3rd intersection
      members:
        - name: leader
          spawn_position: [-300, 8.3, 0.3, 0, 0, 0] # Before 1st intersection
          perception:
            lidar:
              visualize: true
          behavior:
            local_planner:
              debug_trajectory: true
        - name: follower1
          spawn_position: [-315, 8.3, 0.3, 0, 0, 0]
        - name: follower2
          spawn_position: [-330, 8.3, 0.3, 0, 0, 0]

