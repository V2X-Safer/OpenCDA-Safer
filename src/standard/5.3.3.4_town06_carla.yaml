# Standard 5.3.3.4 Platooning Test Configuration
# Map: Town06 | Road ID: 8 | Lane: 1 (center lane)

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05


carla_traffic_manager:
  auto_lane_change: false
  ignore_lights_percentage: 0
  global_speed_perc: 100  # 禁用TM速度干扰

platoon_base:
  max_capacity: 5
  inter_gap: 0.6  # 时间间隔(s)
  open_gap: 1.2
  warm_up_speed: 30  # 初始加速目标(km/h)

scenario:
  range: &road_range
    x: [50, 600]  # 有效生成范围（避开起点50m缓冲）
    y: [139.0, 140.0]
    z: [0, 1]

  platoon_list:
    - name: platoon_5.3.3.4
      platoon_max_speed: 22.22  # 80km/h
      destination: [600.0, 139.51, 0.3]  # 终点坐标
      behavior:
        local_planner:
          min_distance: 10.0
          emergency_stop: false
      members:
        - name: leader
          spawn_position: [100.0, 139.51, 0.3, 0, 0, 0]
          sensors:
            lidar:
              type: "hdl64" 
              range: 100.0
        - name: follower1
          spawn_position: [90.0, 139.51, 0.3, 0, 0, 0]
        - name: follower2
          spawn_position: [80.0, 139.51, 0.3, 0, 0, 0]