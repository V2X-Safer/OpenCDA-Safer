description: |-
  相邻车道车辆横向挤压测试 - 符合T/CMAX 21005-2023标准5.3.9.7要求
  测试编队应对相邻车道车辆横向挤压的反应能力

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 35

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 1
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
    localization: &base_localize
      gnss:
        heading_direction_stddev: 0.1
        speed_stddev: 0.1
  behavior: &base_behavior
    max_speed: 30
    tailgate_speed: 40
    overtake_allowed: false

platoon_base:
  max_capacity: 2
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 20

scenario:
  name: lateral_squeeze_test
  platoon_list:
    - name: squeeze_platoon
      inter_gap: 0.6
      open_gap: 1.2
      warm_up_speed: 20
      platoon_max_speed: 8.33
      destination: [300, 139.51, 0.3]
      members:
        - name: lv_squeeze
          spawn_position: [100.0, 139.51, 0.3, 0, 0, 0]
        - name: fv_squeeze
          spawn_position: [85.0, 139.51, 0.3, 0, 0, 0]

  single_cav_list:
    - name: vt_squeeze
      spawn_position: [90.0, 143.51, 0.3, 0, 0, 0]
      destination: [300, 143.51, 0.3]
      behavior:
        <<: *base_behavior
        squeeze_position: 150.0
        squeeze_distance: 0.8

  evaluation_points:
    - position: 200.0
      checks:
        - name: no_collision
          type: bool
          expected: true
        - name: lane_keeping
          type: bool
          expected: true