description: |-
  跟车停走测试 - 符合T/CMAX 21005-2023标准5.3.8.3要求
  测试编队在停走工况下的跟车能力

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 29

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 1
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
    localization: &base_localize
      gnss:
        heading_direction_stddev: 0.1
        speed_stddev: 0.1
  behavior: &base_behavior
    max_speed: 40
    tailgate_speed: 50
    overtake_allowed: false

platoon_base:
  max_capacity: 2
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 20

scenario:
  name: stop_go_test
  platoon_list:
    - name: stopgo_platoon
      inter_gap: 0.6
      open_gap: 1.2
      warm_up_speed: 20
      platoon_max_speed: 11.11
      destination: [400, 139.51, 0.3]
      members:
        - name: lv_stopgo
          spawn_position: [100.0, 139.51, 0.3, 0, 0, 0]
        - name: fv_stopgo
          spawn_position: [85.0, 139.51, 0.3, 0, 0, 0]

  single_cav_list:
    - name: vt_lead
      spawn_position: [120.0, 139.51, 0.3, 0, 0, 0]
      destination: [400, 139.51, 0.3]
      behavior:
        <<: *base_behavior
        stop_go_sequence:
          - {position: 200.0, stop_duration: 5}
          - {position: 300.0, stop_duration: 5}

  evaluation_points:
    - position: 250.0
      checks:
        - name: stop_response
          type: bool
          expected: true
    - position: 350.0
      checks:
        - name: start_response_time
          type: float
          max: 6.0
          description: "起步响应时间(秒)"