description: |-
  稳定跟车测试 - 符合T/CMAX 21005-2023标准5.3.8.1要求
  测试编队在不同速度下的稳定跟车能力

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 27

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 1
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
    localization: &base_localize
      gnss:
        heading_direction_stddev: 0.1
        speed_stddev: 0.1
  behavior: &base_behavior
    max_speed: 40
    tailgate_speed: 50
    overtake_allowed: false

platoon_base:
  max_capacity: 2
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 20

scenario:
  name: stable_follow_test
  platoon_list:
    - name: follow_platoon
      inter_gap: 0.6
      open_gap: 1.2
      warm_up_speed: 20
      platoon_max_speed: 11.11
      destination: [500, 139.51, 0.3]
      members:
        - name: lv_follow
          spawn_position: [100.0, 139.51, 0.3, 0, 0, 0]
        - name: fv_follow
          spawn_position: [85.0, 139.51, 0.3, 0, 0, 0]

  single_cav_list:
    - name: vt_lead
      spawn_position: [120.0, 139.51, 0.3, 0, 0, 0]
      destination: [500, 139.51, 0.3]
      behavior:
        <<: *base_behavior
        speed_profile:
          - {position: 150.0, speed: 20}
          - {position: 250.0, speed: 30}
          - {position: 350.0, speed: 40}

  evaluation_points:
    - position: 200.0
      checks:
        - name: speed_20_accuracy
          type: float
          expected: 20.0
          tolerance: 1.0
    - position: 300.0
      checks:
        - name: speed_30_accuracy
          type: float
          expected: 30.0
          tolerance: 1.0
    - position: 400.0
      checks:
        - name: speed_40_accuracy
          type: float
          expected: 40.0
          tolerance: 1.0
        - name: lane_keeping
          type: bool
          expected: true