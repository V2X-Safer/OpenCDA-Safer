description: |-
  左侧车辆通行起步测试 - 符合T/CMAX 21005-2023标准5.3.6.2要求
  测试编队在左侧有车辆通过时的起步能力

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 23

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 1
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
    localization: &base_localize
      gnss:
        heading_direction_stddev: 0.1
        speed_stddev: 0.1
  behavior: &base_behavior
    max_speed: 30
    tailgate_speed: 40
    overtake_allowed: false

platoon_base:
  max_capacity: 2
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 20

scenario:
  name: left_vehicle_pass_start_test
  platoon_list:
    - name: left_pass_platoon
      inter_gap: 0.6
      open_gap: 1.2
      warm_up_speed: 20
      platoon_max_speed: 8.33
      destination: [300, 139.51, 0.3]
      members:
        - name: lv_left_pass
          spawn_position: [50.0, 139.51, 0.3, 0, 0, 0]
        - name: fv_left_pass
          spawn_position: [35.0, 139.51, 0.3, 0, 0, 0]

  single_cav_list:
    - name: vt_left
      spawn_position: [40.0, 143.51, 0.3, 0, 0, 0]
      destination: [300, 143.51, 0.3]
      behavior:
        <<: *base_behavior
        max_speed: 40

  evaluation_points:
    - position: 200.0
      checks:
        - name: no_collision
          type: bool
          expected: true
        - name: start_time
          type: float
          max: 8.0
          description: "安全通过后起步时间(秒)"