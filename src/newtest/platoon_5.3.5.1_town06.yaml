description: |-
  制动能力测试(空载) - 符合T/CMAX 21005-2023标准5.3.5.1要求
  测试编队空载状态下的制动性能

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 20

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 1
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
    localization: &base_localize
      gnss:
        heading_direction_stddev: 0.05
        speed_stddev: 0.05
  behavior: &base_behavior
    max_speed: 40
    tailgate_speed: 50
    overtake_allowed: false

platoon_base:
  max_capacity: 2
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 30

scenario:
  name: braking_test_empty
  platoon_list:
    - name: brake_platoon_empty
      inter_gap: 0.6
      open_gap: 1.2
      warm_up_speed: 30
      platoon_max_speed: 11.11
      vehicle_load: empty
      destination: [500, 139.51, 0.3]
      brake_position: 200.0
      brake_deceleration: 3.0
      members:
        - name: lv_brake_empty
          spawn_position: [100.0, 139.51, 0.3, 0, 0, 0]
        - name: fv_brake_empty
          spawn_position: [85.0, 139.51, 0.3, 0, 0, 0]

  evaluation_points:
    - position: 250.0
      checks:
        - name: no_collision
          type: bool
          expected: true
        - name: braking_distance_diff
          type: float
          max: 4.0
          description: "制动距离差值(米)"