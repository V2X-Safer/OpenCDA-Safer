description: |-
  编队加减速跟随性能测试(80km/h空载) - 符合T/CMAX 21005-2023标准5.3.3.2要求
  测试编队在空载条件下从30km/h加速至80km/h再减速回30km/h的跟随性能

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 16
  weather:
    sun_altitude_angle: 60  # 白天良好能见度
    cloudiness: 10
    precipitation: 0
    fog_density: 0

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 1
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]  # 前视摄像头
      lidar:
        visualize: false
    localization: &base_localize
      gnss:
        heading_direction_stddev: 0.05
        speed_stddev: 0.05
      debug_helper:
        show_animation: true
        x_scale: 10.0
        y_scale: 10.0
  map_manager:
    visualize: false
    activate: false
  behavior: &base_behavior
    max_speed: 200  # 最高测试速度80km/h
    tailgate_speed: 85
    overtake_allowed: false
    collision_time_ahead: 1.5

platoon_base:
  max_capacity: 2
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 30
  acceleration_test: true

scenario:
  name: acceleration_test_80kmh_empty
  platoon_list:
    - name: accel_platoon_80_empty
      inter_gap: 0.6
      open_gap: 1.2
      warm_up_speed: 30
      platoon_max_speed: 22.22  # 80 km/h
      leader_accel_threshold: 2.0
      vehicle_load: empty  # 空载状态
      destination: [600, 139.51, 0.3]  # 600m长直道
      speed_profile:  # 速度变化曲线
        - {position: 100.0, speed: 10}  # 初始速度30km/h
        - {position: 200.0, speed: 200}  # 加速至80km/h
        - {position: 400.0, speed: 10}  # 减速回30km/h
      members:
        - name: lv_accel_80_empty
          spawn_position: [50.0, 139.51, 0.3, 0, 0, 0]
          behavior:
            local_planner:
              debug_trajectory: true
              debug: true
        - name: fv_accel_80_empty
          spawn_position: [35.0, 139.51, 0.3, 0, 0, 0]

  evaluation_points:
    - position: 150.0  # 加速阶段检查点
      checks:
        - name: acceleration_started
          type: bool
          expected: true
    - position: 250.0  # 高速稳定阶段检查点
      checks:
        - name: speed_reached
          type: float
          expected: 80.0
          tolerance: 2.0  # 允许±2km/h误差
        - name: lateral_offset
          type: float
          max: 0.5  # 横向偏差<50cm
    - position: 450.0  # 减速阶段检查点
      checks:
        - name: deceleration_completed
          type: bool
          expected: true
        - name: longitudinal_distance
          type: float
          max: 25.0  # 纵向距离<25m