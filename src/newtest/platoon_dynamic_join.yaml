# 场景编号：JZ0102
# 场景名称：动态组队
# 场景说明：
# - 领航车和跟随车在同一车道动态行驶
# - 纵向距离小于50m
# - 两车满足V2V通信条件
# - 进行动态组队测试
# CARLA版本建议：0.9.13+，地图Town06，支持sync_mode与多车spawn

world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 11

vehicle_base:
  sensing:
    perception:
      camera:
        visualize: 0
        num: 0
        positions: []
      lidar:
        visualize: false
    localization:
      gnss:
        heading_direction_stddev: 0.1
        speed_stddev: 0.2
      debug_helper:
        show_animation: false
        x_scale: 10.0
        y_scale: 10.0
  map_manager:
    visualize: false
    activate: false
  behavior:
    max_speed: 70
    tailgate_speed: 80
    overtake_allowed: false
    collision_time_ahead: 1.1

platoon_base:
  max_capacity: 10
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 30

carla_traffic_manager:
  global_distance: 4.0
  global_speed_perc: -50
  ignore_lights_percentage: 0
  vehicle_list:
    - spawn_position: [101.7194, 136.51, 0.3, 0, 0, 0]
    - spawn_position: [57.7194, 143.51, 0.3, 0, 0, 0]
    - spawn_position: [75.7194, 139.51, 0.3, 0, 0, 0]
    - spawn_position: [161.7194, 139.51, 0.3, 0, 0, 0]
    - spawn_position: [141.7194, 139.51, 0.3, 0, 0, 0]
    - spawn_position: [150.7194, 139.51, 0.3, 0, 0, 0]

scenario:
  platoon_list:
    - name: platoon1
      inter_gap: 0.8
      open_gap: 1.5
      warm_up_speed: 30
      platoon_max_speed: 22.22
      leader_accel_threshold: 1.8
      destination: [630, 141.39, 0.3]
      members:
        - name: cav1
          spawn_position: [121.7194, 139.51, 0.3, 0, 0, 0] # 领航车
        - name: cav2
          spawn_position: [101.7194, 139.51, 0.3, 0, 0, 0] # 跟随车，稍远，动态靠近

  single_cav_list:
    - name: cav3
      spawn_position: [47.7194, 143.51, 0.3, 0, 0, 0]
      destination: [500.87, 145.39, 0]
      sensing:
        perception:
          activate: true
          camera:
            visualize: 1
            num: 1
            positions:
              - [2.5, 0, 1.0, 0]
      v2x:
        communication_range: 35
      behavior:
        max_speed: 100
        tailgate_speed: 111
        overtake_allowed: true
        local_planner:
          debug_trajectory: true
          debug: false
