  Author: Runsheng Xu <rxx3386@ucla.edu>

  Content: This is the scenario testing configuration file for single vehicle testing
  in town06 with perception/localization activated'
world:
  sync_mode: true
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 11
  weather:
    sun_altitude_angle: 100.0
    cloudiness: 19.0
    precipitation: 65.0
    precipitation_deposits: 98.0
    wind_intensity: 76.0
    fog_density: 8.878511314314461e+18
    fog_distance: 22.0
    fog_falloff: 6.035942803513541e+18
    wetness: 18.0
    sun_azimuth_angel: -15.0
rsu_base:
  sensing:
    perception:
      activate: false
      camera:
        visualize: 4
        num: 4
        positions:
        - - 2.5
          - 0
          - 1.0
          - 0
        - - 0.0
          - 0.3
          - 1.8
          - 100
        - - 0.0
          - -0.3
          - 1.8
          - -100
        - - -2.0
          - 0.0
          - 1.5
          - 180
      lidar:
        visualize: true
        channels: 32
        range: 120
        points_per_second: 1000000
        rotation_frequency: 20
        upper_fov: 2
        lower_fov: -25
        dropoff_general_rate: 0.3
        dropoff_intensity_limit: 0.7
        dropoff_zero_intensity: 0.4
        noise_stddev: 0.02
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3.0e-06
        noise_lon_stddev: 3.0e-06
vehicle_base:
  sensing:
    perception:
      activate: true
      camera:
        visualize: 4
        num: 4
        positions:
        - - 2.5
          - 0
          - 1.0
          - 0
        - - 0.0
          - 0.3
          - 1.8
          - 100
        - - 0.0
          - -0.3
          - 1.8
          - -100
        - - -2.0
          - 0.0
          - 1.5
          - 180
      lidar:
        visualize: true
        channels: 32
        range: 50
        points_per_second: 100000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.001
        noise_lat_stddev: 1.0e-06
        noise_lon_stddev: 1.0e-06
        heading_direction_stddev: 0.1
        speed_stddev: 0.2
      debug_helper:
        show_animation: true
        x_scale: 1.0
        y_scale: 100.0
  map_manager:
    pixels_per_meter: 2
    raster_size:
    - 224
    - 224
    lane_sample_resolution: 0.1
    visualize: true
    activate: true
  safety_manager:
    print_message: true
    collision_sensor:
      history_size: 30
      col_thresh: 1
    stuck_dector:
      len_thresh: 500
      speed_thresh: 0.5
    offroad_dector: []
    traffic_light_detector:
      light_dist_thresh: 20
  behavior:
    max_speed: 111
    tailgate_speed: 121
    speed_lim_dist: 3
    speed_decrease: 15
    safety_time: 4
    emergency_param: 0.4
    ignore_traffic_light: false
    overtake_allowed: true
    collision_time_ahead: 2.0
    overtake_counter_recover: 35
    sample_resolution: 4.5
    local_planner:
      buffer_size: 12
      trajectory_update_freq: 15
      waypoint_update_freq: 9
      min_dist: 3
      trajectory_dt: 0.2
      debug: false
      debug_trajectory: false
  controller:
    type: pid_controller
    args:
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 1.0
      max_throttle: 1.0
      max_steering: 0.3
  v2x:
    enabled: true
    communication_range: 35
carla_traffic_manager:
  sync_mode: true
  global_distance: 5
  global_speed_perc: -100
  set_osm_mode: true
  auto_lane_change: false
  ignore_lights_percentage: 0
  random: true
  vehicle_list: null
  range:
  - - 50
    - 250
    - 135
    - 145
    - 50
    - 4
    - 30
platoon_base:
  max_capacity: 10
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 55
  change_leader_speed: true
  leader_speeds_profile:
  - 85
  - 95
  stage_duration: 10
scenario:
  single_cav_list:
  - name: cav1
    spawn_position:
    - 47.7194
    - 139.51
    - 0.3
    - 0
    - 0
    - 0
    destination:
    - 600
    - 145.51
    - 0.3
    v2x:
      communication_range: 45
    behavior:
      local_planner:
        debug_trajectory: false
        debug: false
  platoon_list: []
map: Town06
